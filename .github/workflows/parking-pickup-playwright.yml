name: Parking Pickup Playwright

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed URL to test. Leave blank to build this branch and serve it locally.
        required: false
        default: ''

concurrency:
  group: parking-pickup-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:parking-pickup
      report_name: parking-pickup-playwright-report
      timeout_minutes: 30
      base_url: ${{ inputs.base_url }}
