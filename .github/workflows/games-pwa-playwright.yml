name: BWH Games PWA Playwright

on:
  workflow_dispatch:

concurrency:
  group: games-pwa-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:games-pwa
      report_name: games-pwa-playwright-report
      timeout_minutes: 20
      authenticated_fixture: true
