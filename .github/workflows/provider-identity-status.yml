name: Provider Identity Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Read production provider identity status
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: prod
    # Wait for deployment to finish; never inspect a partly activated stable directory.
    concurrency:
      group: website-games-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Inspect deployed configuration without changing it
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing deploy host}" "${SSH_USERNAME:?Missing deploy user}" "${SSH_PRIVATE_KEY:?Missing deploy key}" "${SSH_KNOWN_HOSTS:?Missing pinned host key}"
          key_dir=$(mktemp -d "$RUNNER_TEMP/provider-status.XXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          ssh -F /dev/null -i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$key_dir/known_hosts" \
            "$SSH_USERNAME@$SSH_HOST" \
            'cd "$HOME/games-laravel" && /opt/cpanel/ea-php85/root/usr/bin/php -d memory_limit=1G' \
            < scripts/deploy/provider-identity-status.php
