name: Browser Regression

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-selection:
    name: Select Gameplay Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - name: Test gameplay selection boundaries
        run: node --test scripts/__tests__/select-gameplay-tests.test.mjs

      - name: Select full gameplay groups
        id: select
        env:
          GAMEPLAY_EVENT: ${{ github.event_name }}
        run: node scripts/select-gameplay-tests.mjs

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  pwa:
    needs: frontend-build
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:games-pwa
      report_name: games-pwa-playwright-report
      authenticated_fixture: true
      reuse_frontend_build: true

  gameplay:
    name: Gameplay Browser Checks (${{ matrix.shard }}/${{ needs.browser-selection.outputs.shards }})
    needs: [frontend-build, browser-selection]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-selection.outputs.matrix) }}
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:gameplay
      grep: ${{ matrix.grep }}
      report_name: gameplay-playwright-report-${{ matrix.shard }}-of-${{ needs.browser-selection.outputs.shards }}
      reuse_frontend_build: true
