name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull-request supersession is cheap, but cancelling a main run can strand an
  # in-progress production transaction. Main pushes queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-selection:
    name: Select Gameplay Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Selection lists the tests through Playwright itself, so new tests are never omitted.
      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test gameplay selection boundaries
        run: node --test scripts/__tests__/select-gameplay-tests.test.mjs

      - name: Select gameplay checks
        id: select
        env:
          GAMEPLAY_EVENT: ${{ github.event_name }}
          GAMEPLAY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GAMEPLAY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-gameplay-tests.mjs

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public, so a committed identifier cannot be walked back:
      # deleting it later leaves the value in history and in every fork. The scanner
      # redacts its own output because CI logs for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      # Keeps Mandarin separable (#94): nothing outside its folder imports from it
      # except the allow-list in the script, and its routes stay out of the shared files.
      - name: Check the Mandarin boundary
        run: node scripts/check-mandarin-boundary.mjs

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test deployment guards and production verification
        run: |
          bash -n scripts/deploy/*.sh tests/Deployment/test-deploy-scripts.sh
          tests/Deployment/test-deploy-scripts.sh

  deployment-tests-macos:
    name: Deployment Scripts (macOS)
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Test activation and production verification with macOS Bash
        run: |
          /bin/bash -n scripts/deploy/*.sh tests/Deployment/test-deploy-scripts.sh
          /bin/bash tests/Deployment/test-deploy-scripts.sh

  backend-tests:
    name: Backend Tests
    # Several page tests (e.g. BlockBlasterGamePageTest) render a real Blade view
    # without ->withoutVite(), so they need an actual public/build/manifest.json —
    # reuse frontend-build's artifact instead of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G artisan test --compact

  browser-pwa:
    name: PWA Browser Checks
    needs: frontend-build
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:games-pwa
      report_name: games-pwa-playwright-report
      authenticated_fixture: true
      reuse_frontend_build: true

  browser-gameplay:
    name: Gameplay Browser Checks (${{ matrix.shard }}/${{ needs.browser-selection.outputs.shards }})
    needs: [frontend-build, browser-selection]
    # Only a PR changing nothing but docs selects no gameplay; Run Tests accepts the skip then alone.
    if: needs.browser-selection.outputs.mode != 'none'
    strategy:
      # Finish every shard so failures retain the other runners' reports.
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-selection.outputs.matrix) }}
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:gameplay
      # Each shard runs an exact, duration-balanced list of tests; applying
      # Playwright's native --shard as well would drop most of them.
      test_list: ${{ matrix.tests }}
      report_name: gameplay-playwright-report-${{ matrix.shard }}-of-${{ needs.browser-selection.outputs.shards }}
      reuse_frontend_build: true

  test:
    name: Run Tests
    needs:
      - browser-selection
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - deployment-tests-macos
      - backend-tests
      - browser-pwa
      - browser-gameplay
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "browser-selection" "${{ needs.browser-selection.result }}"
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "deployment-tests-macos" "${{ needs.deployment-tests-macos.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "browser-pwa" "${{ needs.browser-pwa.result }}"
          # The matrix result is successful only when all gameplay shards succeed.
          if [ "${{ needs.browser-selection.outputs.mode }}" = 'none' ]; then
            check "browser-gameplay (docs only, skipped)" "${{ needs.browser-gameplay.result == 'skipped' && 'success' || needs.browser-gameplay.result }}"
          else
            check "browser-gameplay" "${{ needs.browser-gameplay.result }}"
          fi

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Include a status check so a skipped optional job upstream of Run Tests does not
    # trigger GitHub Actions' implicit success() guard and skip deployment.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: website-games-production
      cancel-in-progress: false
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Stamp the candidate source commit
        run: printf '{"source_commit":"%s"}\n' "$GITHUB_SHA" > public/deployment-identity.json

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@5f635730a4ddbac1d10c2a031ac0b4a102066fe2 # v2.5.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: games-laravel
          site-url: https://games.bherila.net
          deployment-mode: atomic
          atomic-layout: stable-directory
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          persistent-paths: storage
          operational-audit: true
          retain-releases: 3
          failure-policy: maintenance
          initial-live-commit: 7462f36067c48b12c786dda82ce01736de5914e1
          install-cron: false
          artisan-memory-limit: 1G
          quiesce-script: scripts/deploy/assert-no-running-artisan.sh
          post-activate-script: scripts/deploy/activate-mandarin-course.sh
          verification-script: scripts/deploy/verify-production.sh
          # Strict execution reports incomplete imports only after writing valid rows.
          # Preflight without writes before allowing shared production data changes.
          artisan-commands: |
            mandarin:course:import resources/data/mandarin/foundations.v1.json --stage
            mandarin:course:import --stage
            mandarin:audio:import resources/data/mandarin/audio-manifest.json --dry-run --verify-objects --strict --require-configured-course
            mandarin:audio:import resources/data/mandarin/audio-manifest.json --execute --verify-objects --strict --require-configured-course

      - name: Explain a deploy that left production in maintenance
        if: failure()
        run: |
          {
            echo '## Production may be in maintenance'
            echo
            echo 'A deploy that fails after the database-risk boundary leaves the site returning 503, and later deploys refuse to touch it.'
            echo 'Follow docs/deploy-recovery.md; the Production Health workflow reports whether the site is serving.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Deploy failed; production may be stranded in maintenance. See docs/deploy-recovery.md.'
