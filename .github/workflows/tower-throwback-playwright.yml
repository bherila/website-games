name: Tower Throwback Playwright

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed URL to test. Leave blank to build this branch and serve it locally.
        required: false
        default: ''

concurrency:
  group: tower-throwback-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    uses: ./.github/workflows/browser-checks.yml
    with:
      script: test:e2e:tower-throwback
      report_name: tower-throwback-playwright-report
      timeout_minutes: 15
      base_url: ${{ inputs.base_url }}
