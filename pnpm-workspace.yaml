# pnpm 11 reads `allowBuilds` and ignores `onlyBuiltDependencies`; older pnpm
# versions do the reverse. Both list the same packages deliberately — without
# `allowBuilds`, pnpm 11 fails closed with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@swc/core': true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@swc/core'
  - unrs-resolver

overrides:
  'brace-expansion@<2.0.0': 1.1.18
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=4.0.0 <6.0.0': 5.0.9
  'fast-uri@>=3.0.0 <4.0.0': 3.1.5
